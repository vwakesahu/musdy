[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "../shared" }]

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 32

[lint]
ignore = ["test/**/*.sol", "script/**/*.sol", "src/mocks/**/*.sol", "src/interfaces/**/*.sol"]
# abi fixes lowercase immutables, every token-moving entry is nonReentrant, deadlines need block.timestamp, permit pulls from its owner by design
exclude_lints = ["screaming-snake-case-immutable", "reentrancy-events", "reentrancy-no-eth", "block-timestamp", "arbitrary-send-erc20", "unused-return"]
